name: Feature request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Check [ROADMAP.md](../blob/main/ROADMAP.md) first, and search the existing issues."
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution. What are you trying to do that SpeechText makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What did you have in mind?
      description: Optional. A rough idea is fine.
  - type: dropdown
    id: area
    attributes:
      label: Which part of SpeechText?
      description: Optional.
      options: ["Inline recording", "AI recording", "Record Window", "Edit selection", "Speech engines / models", "Main window (Home, History, Usage, Prompts, Dictionary)", "Settings / setup", "Other"]
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd be willing to open a PR for this
