name: Vendor watch

# Compares the app's model catalogues with what each vendor serves and says
# (docs/vendor-watch.md), and files what needs acting on as `model-lifecycle`
# issues. Every Monday, and by hand (gh workflow run vendor-watch.yml --ref main).
# A tag is released only after a green Check here within seven days (release.yml).
#
# The vendors' keys are secrets of the `vendor-watch` environment, which only `main`
# may deploy to: a run started on any other branch gets none. Nothing here runs on
# a pull request, so no stranger's code ever sees them, and nothing runs on a
# self-hosted machine, whatever the repository's visibility. The script only reads
# model lists; each key is a separate one for this, restricted where the vendor
# allows it (OpenAI: Models read; ElevenLabs: speech-to-text), under a spending limit.
#
# Two jobs, so the one that holds the keys cannot write to the repository and the one
# that writes issues holds no key:
#   check  builds the catalogue export on a hosted Mac and runs the script;
#   file   files its findings (scripts/vendor-watch/file_issues.py).
#
# Anything that gates on this workflow reads the conclusion of `check`, not of the
# whole run: a red `file` (GitHub's issues API failing) does not mean a vendor changed.
on:
  # Monday 06:17 UTC: off the top of the hour, when GitHub delays scheduled runs
  # most. A schedule runs on the default branch only. GitHub turns it off in a
  # public repository after 60 days with no activity; the release gate then
  # stops the next tag rather than letting old results through.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

# Two runs never file issues at once; a run is never cancelled for the next, since
# each one's snapshots are what the next compares with.
concurrency:
  group: vendor-watch
  cancel-in-progress: false

# The Xcode a hosted Mac selects — see ci.yml.
env:
  XCODE_VERSION: "27.1"

jobs:
  check:
    name: Check
    runs-on: xcode-27
    environment: vendor-watch
    # A cold build of three packages, then a minute of requests.
    timeout-minutes: 45
    permissions:
      contents: read
      # Finds the previous run's snapshots.
      actions: read
    outputs:
      status: ${{ steps.watch.outputs.status }}
      findings: ${{ steps.watch.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: scripts/ci-select-xcode.sh "$XCODE_VERSION"

      # The packages CI's Tests job resolved on main, read but never written: this
      # workflow runs once a week and would only evict CI's own entries.
      - name: Restore the resolved packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('SpeechText/SpeechText.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Exported here, on the day of the run, not taken from CI: the export decides
      # which deprecated models are retired by today's date.
      - name: Export the catalogues
        run: |
          xcodebuild build \
            -project SpeechText/SpeechText.xcodeproj \
            -scheme SpeechTextEvaluation \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath .swiftpm-cache \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/dd/Build/Products/Release/SpeechTextEvaluation" --export-catalogue "$RUNNER_TEMP/out/catalogue.json"

      # The newest snapshots any run on main left (artifacts last 90 days), whatever
      # that run's conclusion: a run that failed the release rule still stored them.
      # None yet means nothing can be called new this time, and the report says so.
      - name: Find the previous snapshots
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vendor-watch-snapshots&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Previous snapshots: ${run_id:-none}"

      - name: Download the previous snapshots
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-watch-snapshots
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/watch/snapshots

      # The step itself never fails: its exit status is the run's verdict, given by
      # the last step, after everything is stored.
      - name: Ask the vendors
        id: watch
        env:
          OPENAI_API_KEY: ${{ secrets.VENDOR_WATCH_OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.VENDOR_WATCH_GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.VENDOR_WATCH_ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.VENDOR_WATCH_ELEVENLABS_API_KEY }}
          # The releases API, under the token's limit rather than this runner's address's.
          GITHUB_TOKEN: ${{ github.token }}
          SPEECHTEXT_VENDOR_WATCH: ${{ runner.temp }}/watch
          # No keys file on this machine: the keys are the environment's.
          SPEECHTEXT_KEYS: /dev/null
        run: |
          set +e
          scripts/check-vendor-models.sh \
            --catalogue "$RUNNER_TEMP/out/catalogue.json" \
            --out "$RUNNER_TEMP/out/report.md" \
            --json "$RUNNER_TEMP/out/findings.json" > /dev/null
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/out/findings.json" ] && echo "findings=true" >> "$GITHUB_OUTPUT"
          [ -f "$RUNNER_TEMP/out/report.md" ] && cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit status $status"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-watch-report
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep the snapshots
        if: always() && steps.watch.outputs.findings == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-watch-snapshots
          path: ${{ runner.temp }}/watch/snapshots/
          retention-days: 90

      # 0 nothing blocks a release; 1 the release rule fails; 3 some vendor or its
      # deprecation page was not checked (docs/vendor-watch.md › The report).
      - name: Verdict
        env:
          STATUS: ${{ steps.watch.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo "Nothing blocks a release." ;;
            1) echo "::error::The release rule fails: see the report in this run's summary."; exit 1 ;;
            3) echo "::error::Some vendor, or its deprecation page, was not checked: not an all-clear."; exit 3 ;;
            *) echo "::error::The script exited $STATUS."; exit 1 ;;
          esac

  file:
    name: File issues
    needs: check
    # The findings are filed precisely when the run is red, and whenever the script
    # got far enough to write them.
    if: ${{ !cancelled() && needs.check.outputs.findings == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-watch-report
          path: ${{ runner.temp }}/out

      - name: File the findings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -I scripts/vendor-watch/file_issues.py --findings "$RUNNER_TEMP/out/findings.json" --run-url "$RUN_URL"
