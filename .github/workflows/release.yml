name: Release

# A pushed tag `vX.Y.Z` builds, signs and notarizes SpeechText and opens a *draft*
# GitHub release with the disk image — publishing it stays a human decision.
#
# A pull request that touches the packaging runs the same script unsigned, so a
# broken release pipeline is found in review rather than on release day.
#
# A tag runs on the organisation's self-hosted Mac, because that is where the
# signing certificate is. That machine is someone's own Mac, not a throwaway VM,
# so the job leaves nothing behind: no sudo, the signing keychain taken back out
# of the user's search list, and the notary key deleted — whether the job
# succeeds, fails or is cancelled. Only someone who can push a tag can start it.
#
# On a public repository a pull request runs the same job on a GitHub-hosted Mac
# instead, and never signs. Anyone may open a pull request there, and a pull
# request is code: run on the self-hosted Mac it would be a stranger's code
# against someone's own keychain and SSH keys. `runs-on` is therefore chosen by
# the event *and* the repository's visibility, and the job's first step refuses
# outright if the three ever disagree. The secrets were already gated on the
# event, and GitHub withholds them from a fork regardless.
#
# Secrets (docs/releasing.md explains where each comes from):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   the signing certificate
#   and either an App Store Connect API key —
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID (issuer empty for an individual key)
#   or an Apple ID —
#   NOTARY_APPLE_ID, NOTARY_APP_PASSWORD, NOTARY_TEAM_ID
#   DEVELOPER_ID_PROFILE_BASE64                          the provisioning profile (keychain group)
#   SPARKLE_ED_PRIVATE_KEY                               the update-signing key

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - scripts/package-release.sh
      - scripts/make-appcast.sh
      - scripts/dmg/**
      - .github/workflows/release.yml
      - SpeechText/SpeechText/SpeechText.entitlements
      - SpeechText/SpeechText.xcodeproj/project.pbxproj
  workflow_dispatch:

# Read-only by default. The one thing here that writes is opening the draft
# release, and it is a job of its own (`release`) that exists only for a tag, so a
# pull request's run — which builds the branch's own scripts — never holds a token
# that can write to the repository.
permissions:
  contents: read

# The Xcode a hosted Mac selects — see ci.yml.
env:
  XCODE_VERSION: "27.1"

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a pull request's branch makes its older unsigned build moot,
  # and on the one runner it would only hold up the next. A tag or a manual run
  # signs and notarizes, and is never cut short for another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package
    # A tag needs the certificate, so it goes to the Mac that holds it, and only
    # someone who can push a tag can start it. A pull request on a public
    # repository is something a stranger can trigger, so it goes to a machine
    # that can be thrown away.
    runs-on: ${{ github.event_name == 'pull_request' && github.repository_visibility != 'private' && 'xcode-27' || 'self-hosted' }}
    # Unsigned it takes ~3 minutes; signed, `notarytool --wait` waits on Apple with
    # no bound of its own. The default six hours would hold the one runner. A
    # timeout cancels the job, and the `always()` cleanup below still runs; a
    # notarization that slow is re-run, not waited out.
    timeout-minutes: 45
    steps:
      # The expression above is the guard; this is the assertion that it held.
      # A pull request that reached the self-hosted Mac must stop before it runs
      # any of the repository's own code, so this is the first step and it does
      # not even check the tree out.
      - name: A public repository's pull request never runs on the self-hosted Mac
        if: github.event_name == 'pull_request' && github.repository_visibility != 'private' && runner.environment != 'github-hosted'
        run: |
          echo "::error::This pull request landed on a self-hosted runner. Refusing to build it."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0

      # Hosted images carry several Xcodes; the self-hosted Mac uses the one it has,
      # and must not be asked for a sudo password. ci.yml says why it is named
      # (XCODE_VERSION) and why the image is `xcode-27`.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: runner.environment == 'github-hosted'
        run: scripts/ci-select-xcode.sh "$XCODE_VERSION"

      - name: The tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          project=$(sed -n 's/.*MARKETING_VERSION = \([0-9][0-9.]*\);.*/\1/p' SpeechText/SpeechText.xcodeproj/project.pbxproj | head -1)
          if [ "v$project" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $project. Cut releases with scripts/rebuild.sh --tag."
            exit 1
          fi

      - name: Import the Developer ID certificate
        id: signing
        # Pull requests never sign: a branch must not be able to produce an image that
        # looks like a release.
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            echo "No signing certificate in the repository secrets."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # The search list as it was, so the cleanup puts back exactly this.
          security list-keychains -d user | tr -d '"' > "$RUNNER_TEMP/keychains-before"
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains-before")
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate imported, but it is not a Developer ID Application identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: A tag is only released signed
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.identity == ''
        run: |
          echo "::error::No Developer ID certificate is configured, so this tag cannot become a release. See docs/releasing.md."
          exit 1

      # On a pull request this is the whole point of the trigger: the packaging
      # script really builds the app and really makes the image, unsigned, so a
      # broken pipeline is found in review rather than on release day.
      - name: Package
        env:
          SPT_DEVELOPER_ID: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_P8_BASE64 || '' }}
          SPT_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_KEY_ID || '' }}
          SPT_NOTARY_ISSUER: ${{ github.event_name != 'pull_request' && secrets.NOTARY_ISSUER_ID || '' }}
          SPT_NOTARY_APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_APPLE_ID || '' }}
          SPT_NOTARY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.NOTARY_APP_PASSWORD || '' }}
          SPT_NOTARY_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.NOTARY_TEAM_ID || '' }}
          # The Developer ID provisioning profile that authorises the keychain group the
          # API keys live in; package-release.sh refuses a signed image without it.
          PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.DEVELOPER_ID_PROFILE_BASE64 || '' }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export SPT_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          if [ -n "$PROFILE_BASE64" ]; then
            printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.provisionprofile"
            export SPT_PROVISIONING_PROFILE="$RUNNER_TEMP/developer-id.provisionprofile"
          else
            # Never the maintainer's own copy under ~/.config on the self-hosted Mac: a
            # release is signed from the repository's secrets or not at all.
            export SPT_PROVISIONING_PROFILE="$RUNNER_TEMP/no-provisioning-profile"
          fi
          scripts/package-release.sh --out "$RUNNER_TEMP/release"

      - name: The release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section, written by hand as the work happened —
          # not a list of commit subjects. The GitHub release and the update window
          # inside the app show the same text.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"

      - name: Write the appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPT_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPT_SPARKLE_KEY" ]; then
            echo "::error::No SPARKLE_ED_PRIVATE_KEY secret, so this release could not be offered as an update. See docs/releasing.md."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          scripts/make-appcast.sh \
            --dmg "$RUNNER_TEMP/release/SpeechText-$version.dmg" \
            --tag "$GITHUB_REF_NAME" \
            --notes "$RUNNER_TEMP/release/notes.md" \
            --out "$RUNNER_TEMP/release"

      # Everything the release job publishes is kept here, because it runs on a
      # different job (and so a different workspace) than the one that built it.
      # A pull request's run only proves the packaging works: nobody downloads its
      # unsigned image, and on a private repository every 30 MB kept for 14 days
      # counts against the account's Actions storage, which a run of pull requests
      # that touched project.pbxproj filled in October 2026 — the next upload, a
      # tag's included, then failed. A tag and a manual run still keep theirs.
      - name: Keep the image
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpeechText-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/appcast.xml
            ${{ runner.temp }}/release/notes.md
            ${{ runner.temp }}/release/build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.provisionprofile"
          keychain="$RUNNER_TEMP/release.keychain-db"
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before")
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

  release:
    name: Draft release
    # Only the draft's creation needs to write to the repository, so only this job
    # may. It checks nothing out and runs none of the repository's code: it takes
    # what `package` built and hands it to `gh`. Tags are pushed by people who may
    # push to the repository, so this is always the self-hosted Mac, as the signing
    # is.
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch what was packaged
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SpeechText-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so there is no .git for `gh` to find the repository in.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # appcast.xml is what installed copies of the app read: publishing the draft is
          # what makes this version the answer at .../releases/latest/download/appcast.xml.
          # SpeechText.dmg is the same image under a name without the version, so
          # .../releases/latest/download/SpeechText.dmg is one link that always downloads
          # the latest. A copy, not gh's `path#label`: a label changes the text on the
          # release page, never the file name in the URL. The appcast's enclosure and the
          # .sha256 name the versioned file, which stays.
          cp "$RUNNER_TEMP/release/SpeechText-$version.dmg" "$RUNNER_TEMP/release/SpeechText.dmg"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/SpeechText-$version.dmg" \
            "$RUNNER_TEMP/release/SpeechText-$version.dmg.sha256" \
            "$RUNNER_TEMP/release/SpeechText.dmg" \
            "$RUNNER_TEMP/release/appcast.xml" \
            --draft --verify-tag \
            --title "SpeechText $version" \
            --notes-file "$RUNNER_TEMP/release/notes.md"
