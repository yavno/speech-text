# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request as advice: it is not one of the checks a merge
# waits for (Tests, Swift lint, Checks), and its pre-merge checks only warn. Everything
# not set here is CodeRabbit's default; the review rules come from AGENTS.md, which it
# reads on its own, and docs/decisions.md (knowledge_base below).
reviews:
  # Only one maintainer reviews (.github/CODEOWNERS).
  suggested_reviewers: false
  in_progress_fortune: false

  auto_review:
    # The default pauses reviews after 5 reviewed commits (seen on #202, 2026-11-08), and
    # says so only by editing the summary comment, so an agent following a pull request
    # (the contribute skill) would wait on a review that is not coming.
    auto_pause_after_reviewed_commits: 0

  merge_risk_instructions: >-
    Higher risk: .github/workflows/ (release.yml signs and notarizes with the
    repository's secrets; no pull request may reach a self-hosted runner); the
    packaging scripts (scripts/package-release.sh, scripts/dmg/, scripts/make-appcast.sh);
    signing, entitlements and Info.plist (SpeechText/SpeechText/SpeechText.entitlements,
    the Info.plist files, DEVELOPMENT_TEAM or signing settings in project.pbxproj);
    API keys (KeychainSecretStorage.swift, APIKeyStore.swift);
    anything that changes what leaves the Mac (docs/privacy.md: audio to the chosen
    speech provider, text and focus context to the chosen AI Rewrite provider,
    FocusContext.swift, the provider clients); migrations of stored settings or models
    (functions named migrate* in SpeechTextCore), since a mistake there changes an
    existing user's setup on update.
    Lower risk: docs/ (docs/specs/ most of all), tests that only add cases, and
    comments.

  path_instructions:
    - path: ".github/workflows/**"
      instructions: >-
        Every job that a pull request can start must run on a GitHub-hosted runner:
        `runs-on` is keyed on the repository's visibility (see the header of ci.yml),
        and a public repository never runs on a self-hosted machine. Flag a hard-coded
        `self-hosted`, a `pull_request_target` trigger that checks out or runs the pull
        request's code, a secret or an environment exposed to a job a pull request can
        start, `permissions` wider than the job needs (the default is none or
        read-only), and an action not pinned to a full commit SHA with its version in a
        comment, as the existing steps do.
    - path: "SpeechText/SpeechText/**/*.swift"
      instructions: >-
        Words the user reads go through the String Catalog
        (docs/specs/2026-11-04-localization.md). Flag UI text that bypasses it:
        `Text(someString)` or a custom view's `String` parameter fed an English literal
        or a computed English sentence; `NSAlert`, menu or notification text not written
        as `String(localized:)`; a sentence glued from pieces with `+` or `joined`; a
        `count == 1 ? … : …` plural branch instead of one key with an interpolated `Int`;
        `uppercased()` on UI text instead of `.textCase(.uppercase)`. User content
        (dictated text, app names, model IDs, vendor names, key names) is shown with
        `Text(verbatim:)`, which is right. Logs (`dlog`) and text sent to a model are not
        translated. Advice only: say what to change, do not block.
    - path: "Packages/SpeechTextCore/Sources/**/*.swift"
      instructions: >-
        Words this package hands to the UI are written as `localized("…")`
        (Localized.swift), whole sentences with interpolated values, and land in this
        package's own String Catalog. Flag a new user-facing English string returned as a
        plain literal. Not translated: identifiers and values that are stored or compared
        (History's places, settings keys), vendor and model names, PromptPresets, and
        anything sent to an API or a model. Advice only.
    - path: "**/*.xcstrings"
      instructions: >-
        A String Catalog. Each new key needs a translator comment that says where the
        text appears and any length limit. Prompts sent to a model are not
        translated. Do not comment on the JSON layout.
    - path: "**/*.swift"
      instructions: >-
        Many things here that look like oversights are decisions: a parameter sent with
        its default value, an audio file written and then not uploaded, settings read
        once per recording, an AI Rewrite failure that pastes the transcript instead of
        reporting an error. Before calling one redundant or wrong, look for its entry in
        docs/decisions.md or the comment above the code (which may sit on the type, not
        the call), and name that entry when the change contradicts it. Do not suggest
        an abstraction, a dependency or a setting the change does not need.

  labeling_instructions:
    - label: bug
      instructions: Fixes behaviour that is wrong in a released build or on main.
    - label: enhancement
      instructions: Adds or changes a feature a user can notice.
    - label: documentation
      instructions: Changes only Markdown files under docs/, the root guides, or skills.
    - label: provider
      instructions: Adds or changes a speech or AI Rewrite provider or its models.
    - label: dependencies
      instructions: Updates a dependency (Swift packages, Actions versions).
    - label: github_actions
      instructions: Changes files under .github/workflows/.
    - label: repo-hygiene
      instructions: Repository, history and process housekeeping with no app change.

  pre_merge_checks:
    docstrings:
      # Comments follow the surrounding code (CONTRIBUTING.md › Formatting), so a
      # coverage threshold would warn on most pull requests.
      mode: "off"
    custom_checks:
      - name: "CHANGELOG left alone"
        mode: "warning"
        instructions: >-
          CHANGELOG.md entries are written by the maintainer after the merge, from the
          pull request's *Users will notice* line (CONTRIBUTING.md, the `changelog`
          skill). Pass if the pull request does not change CHANGELOG.md, or if its
          title starts with `Changelog:` (the catch-up pull request) or it is a release
          pull request made by `scripts/rebuild.sh --tag` (it dates the
          `[Unreleased]` section and sets the version). Fail if any other pull request
          changes CHANGELOG.md; the fix is to move the wording into *Users will
          notice* and revert the file.
      - name: "PR template answered"
        mode: "warning"
        instructions: >-
          Pass if the pull request description answers the three template questions
          with its own text, not only the template's HTML comments: *Users will
          notice* says in a sentence or two what changes for someone using the app,
          or "Nothing"; the **Privacy** line says Yes or No (and, for Yes, what is
          sent or stored and where); and the *Needs a real-app run* section lists
          what to check by hand or says None. "Nothing" is a valid answer: whether
          it is right is the reviewer's call, not this check's. A pull request
          titled `Changelog:` and a release pull request need not answer *Users
          will notice*. Fail if a required answer is missing or left empty.

  finishing_touches:
    docstrings:
      # For the same reason: no generated doc comments.
      enabled: false

  tools:
    # Swift is linted by scripts/lint-swift.sh (swift-format's semantic rules, never
    # layout; CONTRIBUTING.md › Formatting). SwiftLint's defaults would add style
    # findings that rule refuses.
    swiftlint:
      enabled: false

knowledge_base:
  code_guidelines:
    # AGENTS.md is read by default; the decisions behind the code are not. A plain
    # string would scope the file to docs/, where it lives; it governs every path.
    filePatterns:
      - files: "docs/decisions.md"
        applyTo: "**"

chat:
  art: false
