name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Shift+Q
        2. Say "..."
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode?
      options: ["Inline recording", "AI recording", "Record Window", "Edit selection", "Settings / other"]
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Speech engine
      options: ["Apple (on-device)", "Groq", "ElevenLabs", "OpenAI", "Local model (Parakeet / Whisper)", "Not sure"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpeechText version
      description: "Settings › General › Version — click it to copy, then paste here."
      placeholder: "SpeechText 0.9.0 (build 47 · a18a7d1 · 2026-09-16 14:20)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: ["Release download (disk image)", "Built from source with Xcode", "Other"]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "Menu bar icon → Debug Log. It holds app names, counts and timings, not what you dictated. Glance over it and remove anything private before pasting."
      render: text
