name: CI

# Every pull request, and every push to main. A pull request's head has passed
# these jobs by the time it merges, but the squash that lands it is a new commit:
# two green pull requests that each passed alone can combine into a red main, and
# the README's CI badge reads main's latest run, so a workflow that never ran on
# main showed nothing true. What only means something for a pull request (Swift
# lint, and the DCO sign-off and Base branch steps of Checks) is skipped on a push.
#
# Once this repository is public, nothing here may run on the organisation's
# self-hosted Mac. A pull request is code, and on a public repository anyone may
# open one: `xcodebuild test` on that machine would be a stranger's code running
# against someone's own keychain, SSH keys and the app's `app.speech-text.SpeechText`
# defaults domain, which is where a build without the profile keeps the API keys.
#
# So every `runs-on` below is keyed on the repository's visibility rather than
# hard-coded, and the flip is what moves the work: while private, where only
# collaborators can open a pull request, the jobs run on the self-hosted Mac as
# they always have; the moment visibility changes, the tests go to a
# GitHub-hosted Mac — a throwaway VM — and the checks that need no Mac at
# all go to Linux, where they are faster and cost a tenth as much. Nobody has to
# remember a second pull request, and there is no window in which the
# arrangement is wrong.
#
# The polarity is deliberate: an unrecognised visibility falls through to the
# hosted runner, so the failure is a job that does not start rather than a
# stranger's code on someone's Mac.
#
# The hosted Mac is `xcode-27`, not `macos-latest`: the project takes Xcode 27.1
# (Swift 6.4 tools), and `macos-latest` — macOS 26 — carries Xcode 26.6 at most,
# whose Swift 6.3 refuses the package's manifest. `xcode-27` is GitHub's image
# with macOS 27 and Xcode 27.1, still marked preview (actions/runner-images#14404);
# once `macos-latest` carries Xcode 27 it can go back.
#
# Actions minutes are free for a public repository on the standard runners, so
# what was once a cost saving costs nothing to give up. The self-hosted Mac then
# keeps only the tag-triggered packaging in release.yml, which no pull request
# can reach.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository: a job that needs more says so itself.
permissions:
  contents: read

# The Xcode a hosted Mac selects: the project's floor, named rather than the
# newest one found, because the image also carries release candidates — on
# `xcode-27` the newest is `Xcode_27.2_Release_Candidate.app`, linked as
# `Xcode_27.2.app` too, so no file name tells a release from a candidate.
env:
  XCODE_VERSION: "27.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request's branch makes the older run moot. On main the
  # opposite holds: each push is a commit someone may need to find the red one
  # in, so a run is never cancelled for the next.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    # The one job that needs a Mac, and the one that runs a pull request's own
    # code. Public: it gets a disposable Mac.
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'xcode-27' }}
    # GitHub's default is six hours, and while private there is one runner: a hung
    # xcodebuild would hold every queued run behind it. A warm run takes ~3 minutes;
    # a hosted one builds three packages from nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hosted images carry several Xcodes; the self-hosted Mac uses the one it
      # has and must not be asked for a sudo password. The job runs in both
      # places, so the step is written for both. Which one: XCODE_VERSION, above.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: runner.environment == 'github-hosted'
        run: scripts/ci-select-xcode.sh "$XCODE_VERSION"

      # A hosted runner starts empty, so WhisperKit, FluidAudio and Sparkle are
      # cloned from scratch on every run unless they are kept. Package.resolved
      # pins all three, so its hash is exactly the right key.
      #
      # Hosted only. On the self-hosted Mac the restore was no no-op: it pulled the
      # whole 614 MB archive from GitHub at about 1.6 MB/s, 6.5 of the job's 9
      # minutes (2026-10-21), and checkout's clean had just deleted the folder it
      # fills. Without it xcodebuild resolves from SwiftPM's own cache on that
      # machine — the run with no archive yet resolved and tested in 54 s.
      - name: Cache the resolved packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('SpeechText/SpeechText.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Packages/SpeechTextCore, on its own: Xcode passes no project build setting
      # into a package, so SPT_WARNINGS_AS_ERRORS below never reaches it, and
      # neither does an environment variable read by its manifest, whose evaluation
      # SwiftPM caches per user without the environment. A fresh scratch path, so a
      # warning in a file that did not change still shows on a rerun.
      - name: Build SpeechTextCore with warnings as errors
        run: |
          rm -rf "$RUNNER_TEMP/core-build"
          swift build \
            --package-path Packages/SpeechTextCore \
            --scratch-path "$RUNNER_TEMP/core-build" \
            -Xswiftc -warnings-as-errors

      # Coverage is measured on every run and only reported: no threshold, and the
      # summary step below never fails the job. The result bundle is removed first
      # because the self-hosted runner keeps $RUNNER_TEMP between runs, and
      # xcodebuild refuses to write over an existing one.
      #
      # SPT_WARNINGS_AS_ERRORS turns a compiler warning in our own targets into an
      # error (the project points SWIFT_TREAT_WARNINGS_AS_ERRORS at it). Not
      # SWIFT_TREAT_WARNINGS_AS_ERRORS itself: on the command line that reaches the
      # Swift packages too, which Xcode builds with -suppress-warnings, and the
      # compiler refuses the pair. Local builds leave it off.
      - name: Test
        run: |
          rm -rf "$RUNNER_TEMP/tests.xcresult"
          xcodebuild test \
            -project SpeechText/SpeechText.xcodeproj \
            -scheme SpeechText \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .swiftpm-cache \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SPT_WARNINGS_AS_ERRORS=YES

      - name: Coverage summary
        if: always()
        continue-on-error: true
        run: scripts/coverage-summary.sh "$RUNNER_TEMP/tests.xcresult" >> "$GITHUB_STEP_SUMMARY"

      # The corpus tool links SpeechTextCore and compiles the engine runtimes itself.
      # Built, never run: running it needs recordings and keys this machine does not have.
      - name: Build the evaluation tool
        run: |
          xcodebuild build \
            -project SpeechText/SpeechText.xcodeproj \
            -scheme SpeechTextEvaluation \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .swiftpm-cache \
            CODE_SIGNING_ALLOWED=NO \
            SPT_WARNINGS_AS_ERRORS=YES

  swift-lint:
    name: Swift lint
    # Runs on a Mac for the same reason Tests does: swift-format is the one in Xcode
    # (`xcrun swift-format`), not a dependency of ours. It reads the Swift files the
    # pull request adds or changes, and reports a finding only on a line it added or
    # changed, which is also why it is lint-only and filtered. The code is wrapped as
    # Xcode wraps it, aligned under the first argument, and swift-format's
    # pretty-printer cannot express that: formatting the tree rewrites about 9,500
    # lines. So the formatter is never run, and its
    # layout findings (indentation, line breaks, spacing, line length, trailing
    # commas) are dropped by rule tag; what is kept are the rules that name a
    # construct to avoid. scripts/lint-swift.sh holds the list and .swift-format the
    # configuration — an old finding elsewhere in a touched file is left alone.
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'xcode-27' }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # See the Tests job: hosted images carry several Xcodes, the self-hosted Mac
      # uses the one it has.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: runner.environment == 'github-hosted'
        run: scripts/ci-select-xcode.sh "$XCODE_VERSION"

      - name: swift-format finds nothing in the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/lint-swift.sh "$BASE"

  checks:
    name: Checks
    # The checks that read the tree or the pull request and need no Mac, as one
    # job. Seven jobs of ten seconds each queued one by one on the single
    # self-hosted runner, and a failing grep could report last, after Tests. Every
    # step runs whatever the one before it did (`!cancelled()`), so one run shows
    # every check that fails, each under its own name. Once public: Linux.
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      # Base branch reads the pull request's labels.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DCO sign-off walks the pull request's commits.
          fetch-depth: 0

      # Greps a tracked file.
      - name: No development team
        if: ${{ !cancelled() }}
        run: |
          if grep -nE 'DEVELOPMENT_TEAM = "?[A-Z0-9]' SpeechText/SpeechText.xcodeproj/project.pbxproj; then
            echo
            echo "project.pbxproj carries a DEVELOPMENT_TEAM. Xcode puts it back whenever a"
            echo "build setting changes — revert that hunk so the repo builds for anyone."
            exit 1
          fi

      # Reads the first two lines of every Swift file (lines 2–3 of a Package.swift).
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          missing=""
          for file in $(git ls-files '*.swift'); do
            # A Package.swift must open with `// swift-tools-version`; its header follows.
            case $file in
              */Package.swift|Package.swift) header=$(sed -n '2,3p' "$file") ;;
              *) header=$(head -2 "$file") ;;
            esac
            if ! printf '%s' "$header" | grep -q 'SPDX-FileCopyrightText' \
               || ! printf '%s' "$header" | grep -q 'SPDX-License-Identifier'; then
              missing="$missing  $file"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "These files are missing the two-line SPDX header:"
            printf '%s' "$missing"
            echo
            echo "The header is the file's licence notice, not decoration — see CONTRIBUTING.md."
            exit 1
          fi

      # docs/adding-a-provider.md names the files and declarations a new
      # provider touches, and explains every capability a model can have; this fails when
      # one of them is renamed or removed, or a capability is added, and the guide was not
      # updated with it.
      - name: Provider guide
        if: ${{ !cancelled() }}
        run: scripts/check-provider-guide.sh

      # Every Debug Log entry also goes to the system log as public, so a dlog
      # line may say how long a dictation is, never what it says.
      - name: Log privacy
        if: ${{ !cancelled() }}
        run: scripts/check-log-privacy.sh

      # Packages/SpeechTextCore is the logic the tests reach without the app,
      # so no file there may import SwiftUI — a system framework its manifest cannot
      # refuse. The engines are a build error there already and are checked anyway.
      - name: Core imports
        if: ${{ !cancelled() }}
        run: scripts/check-core-imports.sh

      # Reads the pull request's commit messages. Pull requests only.
      - name: DCO sign-off
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          missing=""
          for sha in $(git rev-list "$BASE..$HEAD"); do
            # Dependabot writes no Signed-off-by and cannot be told to, and a bot
            # cannot certify origin anyway. Its commits are exempt only in a pull
            # request Dependabot itself opened: an author email alone can be
            # written by anyone.
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] \
               && [ "$(git show -s --format=%ae "$sha")" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              continue
            fi
            if ! git show -s --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              missing="$missing$(git show -s --format='  %h %s' "$sha")"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by trailer:"
            echo "$missing"
            echo "Fix the last commit with:   git commit --amend -s"
            echo "Fix every commit in the PR: git rebase --signoff $BASE"
            echo "Then force-push the branch."
            exit 1
          fi
          echo "All commits are signed off."

      # Reads the pull request's metadata, nothing from the tree. Pull requests only.
      - name: Base branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$BASE" = "main" ]; then
            echo "Base is main."
            exit 0
          fi

          # Read the labels now rather than out of the event payload: a pull request
          # is usually labelled *after* CI has already refused it, and the payload a
          # re-run replays is the one the run started with.
          labels=$(gh pr view "$NUMBER" --json labels --jq '.labels[].name')
          if ! printf '%s\n' "$labels" | grep -qx 'stacked'; then
            echo "::error::This pull request is based on '$BASE', not main."
            echo
            echo "A pull request based on another branch is a stack, and a stack has lost"
            echo "work here before: the base landed in main first, the next one then merged"
            echo "into a branch nobody was watching, and its commits never reached main."
            echo
            echo "Either retarget this pull request at main, or label it 'stacked' and"
            echo "re-run the Checks job — the label is a promise that someone lands it afterwards."
            exit 1
          fi

          # Labelled. The base branch must still be an *open* pull request: if its own
          # pull request has already merged, this one would be the next such merge.
          open=$(gh pr list --head "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Stacked, and the stack is intact."
            echo
            echo "  PR #$open  ($BASE)  →  main          lands first"
            echo "  PR #$NUMBER  (this one)  →  $BASE   lands after it, retargeted at main"
            echo
            echo "::notice::PR #$NUMBER must land after PR #$open, retargeted at main."
            exit 0
          fi

          merged=$(gh pr list --head "$BASE" --state merged --json number --jq '.[0].number // empty')
          if [ -n "$merged" ]; then
            echo "::error::PR #$merged already merged '$BASE' into main, so this pull request would merge into a branch that main has stopped following, and its commits would never reach main."
            echo
            echo "Retarget this pull request at main and push."
            exit 1
          fi

          echo "::error::No pull request has '$BASE' as its head, so nothing is going to carry this work into main."
          echo
          echo "Open the base's pull request first, or retarget this one at main."
          exit 1
